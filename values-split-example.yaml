# =============================================================================
# values の分割例
#
#   helm upgrade -f base-values.yaml -f filter-values.yaml の2枚を後勝ちで重ねる。
#   重要: application-log.conf は filter-values.yaml にのみ置く。
#         base 側に同キーを置くと後勝ちマージで競合・上書き事故の原因になる。
# =============================================================================


# ============================ base-values.yaml ===============================
# リポジトリ管理。変更頻度が低い安定部分。CodeBuild のソースに含める。
# (このブロックを base-values.yaml として保存する)

# clusterName / region は buildspec の --set で渡しているため、ここでは任意。
# 必要なら agent やトレランスなど安定設定をここに置く。
# 例として、RUN_WITH_IRSA を values で渡したい場合の agent.env を示すが、
# 正確なパスは使用版 values.yaml の agent セクションで要確認(版依存)。確実な経路は
# buildspec の kubectl patch。下記を使うかは検証後に決めること。
#
# agent:
#   env:
#     - name: RUN_WITH_IRSA
#       value: "True"

containerLogs:
  enabled: true
# ここに application-log.conf を書かないこと(filter 側に集約)


# =========================== filter-values.yaml ==============================
# S3 管理。フィルタ条件の可変部分。grep の Exclude 値を変えるたびに差し替える。
# (このブロックを filter-values.yaml として保存し S3 に置く)
#
# 注意: application-log.conf 全文を自分のアドオン版の原文ベースで記述すること
#       (版により aws フィルタ/Use_Pod_Association/add_entity の有無が異なる。
#        取得手順は application-log-conf-source.md を参照)。
# Helm の values なので Terraform のような $${...} エスケープは不要。素のまま書ける。

containerLogs:
  fluentBit:
    config:
      extraFiles:
        application-log.conf: |
          [INPUT]
              Name                tail
              Tag                 application.*
              Exclude_Path        /var/log/containers/cloudwatch-agent*, /var/log/containers/fluent-bit*, /var/log/containers/aws-node*, /var/log/containers/kube-proxy*
              Path                /var/log/containers/*.log
              multiline.parser    docker, cri
              DB                  /var/fluent-bit/state/flb_container.db
              Mem_Buf_Limit       50MB
              Skip_Long_Lines     On
              Refresh_Interval    10
              Rotate_Wait         30
              storage.type        filesystem
              Read_from_Head      ${READ_FROM_HEAD}

          [INPUT]
              Name                tail
              Tag                 application.*
              Path                /var/log/containers/fluent-bit*
              multiline.parser    docker, cri
              DB                  /var/fluent-bit/state/flb_log.db
              Mem_Buf_Limit       5MB
              Skip_Long_Lines     On
              Refresh_Interval    10
              Read_from_Head      ${READ_FROM_HEAD}

          [INPUT]
              Name                tail
              Tag                 application.*
              Path                /var/log/containers/cloudwatch-agent*
              multiline.parser    docker, cri
              DB                  /var/fluent-bit/state/flb_cwagent.db
              Mem_Buf_Limit       5MB
              Skip_Long_Lines     On
              Refresh_Interval    10
              Read_from_Head      ${READ_FROM_HEAD}

          [FILTER]
              Name                aws
              Match               application.*
              az                  false
              ec2_instance_id     false
              Enable_Entity       true

          [FILTER]
              Name                kubernetes
              Match               application.*
              Kube_URL            https://kubernetes.default.svc:443
              Kube_Tag_Prefix     application.var.log.containers.
              Merge_Log           On
              Merge_Log_Key       log_processed
              K8S-Logging.Parser  On
              K8S-Logging.Exclude Off
              Labels              Off
              Annotations         Off
              Use_Kubelet         On
              Kubelet_Port        10250
              Buffer_Size         0
              Use_Pod_Association On

          [FILTER]
              Name                grep
              Match               application.*
              Exclude             $log_processed['logType'] ^T001$

          [OUTPUT]
              Name                cloudwatch_logs
              Match               application.*
              region              ${AWS_REGION}
              log_group_name      /aws/containerinsights/${CLUSTER_NAME}/application
              log_stream_prefix   ${HOST_NAME}-
              auto_create_group   true
              extra_user_agent    container-insights
              add_entity          true
