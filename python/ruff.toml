# レビュー時に「意図した除外」と「見落とし」を区別できるよう、
# 除外理由を明記する。
target-version = "py313"
line-length = 88
src = ["."]

[lint]
select = ["ALL"]
ignore = [
  # --- スタイルの方針 ---
  "D",        # docstring の書式は Google/NumPy 形式に寄せない（日本語の説明文が主）
  "ANN",      # 型注釈は公開関数のみ。内部ヘルパまで強制しない
  "COM812",   # フォーマッタと競合する
  "CPY001",   # 社内コードのため著作権ヘッダ不要
  "RUF001", "RUF002", "RUF003",  # 日本語コメント中の全角記号を曖昧文字として検出するため
  "ERA001",   # 「発生元: dynamodb / eks」のようなスラッシュ区切りの日本語コメントを
              # コメントアウトされたコードと誤検出するため

  # --- 設計判断として意図的に許容 ---
  "TC001",    # 設定クラスは型注釈専用だが、TYPE_CHECKING に隠すと
              # 各ハンドラの依存関係が読み取りにくくなるため実インポートのまま
  "TRY003",   # 例外に構造化した情報（失敗項目の JSON）を載せる設計のため
  "PERF203",  # run_per_item はループ内 try/except が要件そのもの（1 件失敗しても続行）
  "EM",       # 上と同じ理由。例外メッセージを変数に切り出さない
]

[lint.per-file-ignores]
# テストコードは assert とダミー認証情報を使う。private への参照も許容する。
"tests/*" = ["S101", "S105", "S106", "SLF001", "ARG001", "ARG002", "PLR2004"]
# ハンドラのシグネチャは全ハンドラで揃える。使わない引数があっても変えない。
"dr_switch/*/handlers.py" = ["ARG001"]
"dr_switch/core/middleware.py" = ["ARG001"]
